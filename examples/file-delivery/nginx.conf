daemon off;
pid logs/nginx.pid;
error_log logs/error.log;
worker_processes 1;

events { worker_connections 128; }

http {
  default_type application/octet-stream;
  log_format delivery '$status bytes=$body_bytes_sent seconds=$request_time range="$http_range"';
  access_log logs/access.log delivery;
  sendfile on;

  server {
    listen 127.0.0.1:8080;
    location /media/ {
      root data;
      try_files $uri =404;
    }
  }
}
