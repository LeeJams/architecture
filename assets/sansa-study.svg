<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
  <title id="title">산사의 방 동기화를 설명하는 도식</title>
  <desc id="desc">내 브라우저의 위치와 행동이 방의 연결을 거쳐 다른 브라우저의 장면으로 전달되는 설명용 구성입니다. 실제 서비스 화면은 아닙니다.</desc>
  <rect width="880" height="480" fill="#edf1f5"/>
  <g fill="none" stroke="#b6c1cd" stroke-width="2">
    <rect x="54" y="116" width="280" height="228" rx="12" fill="#fff"/>
    <rect x="546" y="116" width="280" height="228" rx="12" fill="#fff"/>
    <path d="M54 156h280M546 156h280"/>
    <path d="m82 288 112-68 112 68-112 37Z" fill="#f3f6f9"/>
    <path d="m574 288 112-68 112 68-112 37Z" fill="#f3f6f9"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#24292f" font-size="18">
    <text x="80" y="143">내 브라우저</text><text x="572" y="143">같은 방의 브라우저</text>
    <text x="68" y="70" font-size="27" font-weight="700">같은 공간, 각자의 화면</text>
    <text x="68" y="410" font-size="17" fill="#526579">위치·행동 전달과 장면 갱신을 나누어 읽습니다.</text>
    <text x="68" y="442" font-size="15" fill="#526579">산사 동기화 설명도 · 실제 화면을 재현한 이미지가 아닙니다.</text>
  </g>
  <g fill="#526579"><circle cx="192" cy="243" r="14"/><path d="M174 288v-24a18 18 0 0 1 36 0v24Z"/></g>
  <g fill="#0969da"><circle cx="684" cy="243" r="14"/><path d="M666 288v-24a18 18 0 0 1 36 0v24Z"/></g>
  <g stroke="#4778b8" stroke-width="2" fill="none"><path d="M334 245h46m120 0h46"/><path d="m536 239 10 6-10 6"/></g>
  <rect x="380" y="205" width="120" height="80" rx="9" fill="#fff" stroke="#8ba5c5" stroke-width="2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle"><text x="440" y="235" font-size="17" fill="#24292f">방의 연결</text><text x="440" y="263" font-size="14" fill="#0756ad">WebSocket</text></g>
</svg>
